                                  ? resumenPuntos.parguito.clientesCola.slice(0, 2).map(r => `${r.cli} (#${r.motoNum})`).join(' • ')
                                  : 'Sin espera'}
                              </strong>
                            </div>
                          </div>
                        </div>

                        {/* ZONA 2: SUNSOL ISLA CARIBE (FRENTE AL HOTEL) */}
                        <div className="lg:col-span-4 bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/40 p-5 sm:p-6 space-y-4">
                          <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                            <div>
                              <span className="text-[10px] font-mono uppercase tracking-wider text-emerald-600 font-bold block">Punto Operativo #2</span>
                              <h3 className="text-lg font-extrabold text-[#0D1B2A]">Sunsol Isla Caribe</h3>
                            </div>
                            <span className="px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">
                              {resumenPuntos.sunsol.motos.length} {resumenPuntos.sunsol.motos.length === 1 ? 'Moto' : 'Motos'}
                            </span>
                          </div>

                          <div className="space-y-2 text-xs">
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">Unidades en hotel:</span>
                              <strong className="text-slate-900">
                                {resumenPuntos.sunsol.motos.length > 0
                                  ? resumenPuntos.sunsol.motos.map(m => `#${m.numero} (${m.estado === 'en_agua' ? 'Agua' : m.estado === 'disponible' ? 'Libre' : 'Taller'})`).join(' • ')
                                  : 'Ninguna'}
                              </strong>
                            </div>
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">Navegando ahora:</span>
                              <strong className="text-emerald-600">
                                {resumenPuntos.sunsol.enAgua.length > 0
                                  ? resumenPuntos.sunsol.enAgua.map(m => `${m.alquiler.cliente} (#${m.numero})`).join(', ')
                                  : '0 en agua'}
                              </strong>
                            </div>
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">En espera:</span>
                              <strong className="text-slate-700">
                                {resumenPuntos.sunsol.clientesCola.length > 0
                                  ? resumenPuntos.sunsol.clientesCola.slice(0, 2).map(r => `${r.cli} (#${r.motoNum})`).join(' • ')
                                  : 'Sin espera'}
                              </strong>
                            </div>
                          </div>
                        </div>

                        {/* PANEL DE SALUD MECÁNICA Y MANTENIMIENTO DE LAS 3 MOTOS */}
                        <div className="lg:col-span-4 bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/40 p-5 sm:p-6 space-y-4 flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                              <div>
                                <span className="text-[10px] font-mono uppercase tracking-wider text-[#E5097F] font-bold block">Servicio Yamaha (50h)</span>
                                <h3 className="text-lg font-extrabold text-[#0D1B2A]">Salud de Flota</h3>
                              </div>
                              <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${
                                alertasMantenimiento.length > 0 ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'
                              }`}>
                                {alertasMantenimiento.length > 0 ? `${alertasMantenimiento.length} Alerta(s)` : 'Flota Óptima'}
                              </span>
                            </div>

                            <div className="pt-2 space-y-2 text-xs">
                              {motos.map(m => {
                                const srv = estadoServicioMoto(m);
                                return (
                                  <div key={m.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50">
                                    <span className="font-bold text-[#0D1B2A]">#{m.numero} ({m.horometro.toFixed(1)}h):</span>
                                    <span className={`px-2 py-0.5 rounded-md text-[11px] font-medium ${
                                      m.estado === 'mantenimiento'
                                        ? 'bg-slate-200 text-slate-800'
                                        : srv.vencido
                                        ? 'bg-rose-100 text-rose-700 font-bold'
                                        : srv.proximo
                                        ? 'bg-amber-100 text-amber-800 font-bold'
                                        : 'bg-emerald-100 text-emerald-800'
                                    }`}>
                                      {m.estado === 'mantenimiento'
                                        ? 'En Taller'
                                        : `Faltan ${srv.hrsRestantes}h`}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* CONTROL RÁPIDO DE MODO DE BLOQUEO DE FLOTA */}
                          <div className="pt-3 border-t border-slate-100">
                            <span className="text-[10px] uppercase font-bold text-slate-500 block mb-1.5">
                              Regla de Agendamiento al Público:
                            </span>
                            <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl">
                              <button
                                type="button"
                                onClick={() => handleToggleModoBloqueoFlota('exclusivo')}
                                className={`px-2 py-1.5 text-xs font-bold rounded-lg transition cursor-pointer ${
                                  modoBloqueoFlota === 'exclusivo'
                                    ? 'bg-[#0D1B2A] text-white shadow-xs'
                                    : 'text-slate-600 hover:text-black'
                                }`}
                              >
                                Bloqueo Flota (Privado)
                              </button>
                              <button
                                type="button"
                                onClick={() => handleToggleModoBloqueoFlota('multimoto')}
                                className={`px-2 py-1.5 text-xs font-bold rounded-lg transition cursor-pointer ${
                                  modoBloqueoFlota === 'multimoto'
                                    ? 'bg-[#0284C7] text-white shadow-xs'
                                    : 'text-slate-600 hover:text-black'
                                }`}
                              >
                                Multimoto (3 Citas)
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* TARJETAS TELEMÉTRICAS DE LAS 3 MOTOS YAMAHA */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {motos.map(moto => {
                          const enAgua = moto.estado === 'en_agua' && moto.alquiler;
                          const disponible = moto.estado === 'disponible';
                          const taller = moto.estado === 'mantenimiento';
                          const timer = enAgua ? formatCountdown(moto.alquiler.horaRetornoMs) : null;
                          const pctGas = Math.round((moto.gasolinaLts / moto.gasolinaMax) * 100);
                          const srv = estadoServicioMoto(moto);

                          return (
                            <div key={moto.id} className="bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 overflow-hidden flex flex-col justify-between">
                              <div>
                                {/* Foto oficial y cabecera de la unidad (estilo Vista Cliente) */}
                                <div className="relative h-48 w-full bg-gradient-to-b from-[#0D1B2A] via-[#112233] to-[#0A1420] overflow-hidden flex items-center justify-center p-3">
                                  <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-sky-900/30 via-transparent to-transparent pointer-events-none"></div>
                                  <img
                                    src={moto.imagen || "yamaha_waverunner_real.png"}
                                    alt={moto.nombre}
                                    className="max-h-36 w-auto object-contain drop-shadow-[0_15px_25px_rgba(0,0,0,0.85)] hover:scale-105 transition-transform duration-500 relative z-10"
                                  />

                                  {/* Badges superiores de identificacion y estado */}
                                  <div className="absolute top-3 left-3 flex items-center gap-1.5 z-20">
                                    <span className="px-2.5 py-1 rounded-md bg-[#0D1B2A]/90 backdrop-blur-sm text-[#8FD6F2] font-mono text-xs font-black shadow border border-white/10">
                                      MOTO #{moto.numero}
                                    </span>
                                    <span className="px-2 py-0.5 rounded-md bg-[#1DA1DB]/90 backdrop-blur-sm text-white font-mono text-[10px] font-bold uppercase shadow">
                                      {moto.ubicacion === 'sunsol' ? 'SUNSOL ISLA CARIBE' : 'PLAYA PARGUITO'}
                                    </span>
                                  </div>

                                  <div className="absolute top-3 right-3 z-20">
                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-condensed font-black uppercase tracking-wider shadow ${
                                      enAgua ? 'bg-[#E5097F] text-white animate-pulse' : disponible ? 'bg-[#1DA1DB] text-white' : 'bg-amber-600 text-white'
                                    }`}>
                                      {enAgua ? 'EN EL AGUA' : disponible ? 'LISTA EN ORILLA' : 'EN TALLER'}
                                    </span>
                                  </div>

                                  {/* Datos del modelo y tarifas oficiales superpuestos */}
                                  <div className="absolute bottom-2.5 left-3.5 right-3.5 flex items-end justify-between text-white z-20 pointer-events-none">
                                    <div>
                                      <span className="font-condensed text-xl font-black uppercase block leading-none drop-shadow">
                                        {moto.nombre}
                                      </span>
                                      <span className="text-[10px] font-mono font-bold text-[#8FD6F2] block mt-0.5 uppercase tracking-wide drop-shadow">
                                        {moto.subtitulo}
                                      </span>
                                    </div>
                                    <div className="text-right">
                                      <span className="text-[10px] font-mono text-slate-300 block drop-shadow">15m: 30€ • 20m: 40€</span>
                                      <span className="text-[10px] font-mono text-slate-300 block drop-shadow">30m: 60€</span>
                                    </div>
                                  </div>
                                </div>
                                <div className="p-5 space-y-4">
                                  {/* Resumen de especificaciones del cliente */}
                                  <div className="flex items-center justify-between text-xs text-slate-500 pb-1 border-b border-slate-100">
                                    <span className="font-medium text-[11px] text-slate-600">
                                      Capacidad: <strong className="text-slate-800 font-bold">{moto.capacidad || '1 a 2 Personas'}</strong>
                                    </span>
                                    <span className="text-[11px] text-[#E5097F] font-bold uppercase tracking-wider">
                                      Tarifa Base: 30€
                                    </span>
                                  </div>
                                  {/* Selector rápido de ubicación */}
                                  <div className="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-200/80 text-xs">
                                    <span className="font-semibold text-slate-600 text-[11px]">
                                      Ubicación Unidad #{moto.numero}:
                                    </span>
                                    <div className="flex gap-1">
                                      {[
                                        { id: 'parguito', label: 'Parguito' },
                                        { id: 'sunsol', label: 'Sunsol' }
                                      ].map(ub => (
                                        <button
                                          key={ub.id}
                                          type="button"
                                          onClick={() => handleCambiarUbicacionMoto(moto.numero, ub.id)}
                                          className={`px-3 py-1 rounded-lg text-xs font-bold transition cursor-pointer ${
                                            moto.ubicacion === ub.id
                                              ? 'bg-[#0D1B2A] text-white shadow-xs'
                                              : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200'
                                          }`}
                                        >
                                          {ub.label}
                                        </button>
                                      ))}
                                    </div>
                                  </div>

                                  {/* Estado en vivo: En agua / Disponible / Taller */}
                                  {enAgua ? (
                                    <div className="p-4 rounded-2xl bg-gradient-to-br from-rose-50 to-pink-50 border border-pink-200 space-y-3">
                                      <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-mono uppercase font-bold text-rose-600">Cronómetro en Vivo</span>
                                        <button
                                          type="button"
                                          onClick={playWhistle}
                                          className="px-3 py-1 bg-white hover:bg-slate-100 text-[#0D1B2A] rounded-xl text-xs font-bold uppercase flex items-center gap-1.5 shadow-xs border border-slate-200 cursor-pointer transition"
                                        >
                                          <Icons.Volume className="w-3.5 h-3.5 text-[#E5097F]" />
                                          <span>Silbato Fox 40</span>
                                        </button>
                                      </div>
                                      <div className="flex items-baseline justify-between">
                                        <strong className="text-4xl font-extrabold text-[#E5097F] tracking-tight">{timer.txt}</strong>
                                        <span className="text-xs font-bold text-slate-700 bg-white px-2.5 py-1 rounded-lg border border-pink-100">
                                          {moto.alquiler.duracionMin}m ({moto.alquiler.tarifaEUR}€)
                                        </span>
                                      </div>
                                      <div className="text-xs pt-2.5 border-t border-pink-200/80">
                                        <strong className="block text-slate-900 font-bold">Piloto: {moto.alquiler.cliente}</strong>
                                        <span className="text-slate-600 text-[11px]">
                                          {moto.alquiler.puntoEmbarque === 'sunsol' ? 'Salida: Sunsol' : 'Salida: Parguito'} • Chaleco #{moto.alquiler.chaleco}
                                        </span>
                                      </div>
                                    </div>
                                  ) : disponible ? (
                                    <div className="p-4 rounded-2xl bg-sky-50 border border-sky-100 text-xs">
                                      <strong className="text-[#0284C7] block font-bold text-sm">
                                        Unidad Lista en {moto.ubicacion === 'sunsol' ? 'Sunsol Isla Caribe' : 'Playa Parguito'}
                                      </strong>
                                      <span className="text-slate-600 text-xs mt-0.5 block">
                                        Lista para cargar al siguiente cliente o despachar de inmediato.
                                      </span>
                                    </div>
                                  ) : (
                                    <div className="p-4 rounded-2xl bg-slate-100 border border-slate-200 text-xs">
                                      <strong className="text-slate-800 block font-bold text-sm">En Taller (Carril Bloqueado)</strong>
                                      <span className="text-slate-600">{moto.motivoTaller}</span>
                                    </div>
                                  )}

                                  {/* Control de Gasolina y Horómetro */}
                                  <div className="grid grid-cols-2 gap-3 text-xs">
                                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
                                      <div className="flex justify-between items-center">
                                        <span className="font-bold text-slate-500 uppercase text-[10px]">Gasolina</span>
                                        {moto.gasolinaLts < 60 && (
                                          <button
                                            type="button"
                                            onClick={() => handleSurtirTanque(moto.numero)}
                                            className="text-[10px] font-bold text-[#E5097F] hover:underline cursor-pointer"
                                          >
                                            + Surtir
                                          </button>
                                        )}
                                      </div>
                                      <strong className="text-base font-extrabold block mt-1 text-slate-900">{moto.gasolinaLts}L / 60L</strong>
                                      <div className="w-full h-2 bg-slate-200 rounded-full mt-2 overflow-hidden">
                                        <div
                                          className={`h-full rounded-full transition-all duration-300 ${
                                            moto.gasolinaLts <= 12 ? 'bg-[#E5097F]' : 'bg-[#0284C7]'
                                          }`}
                                          style={{ width: `${pctGas}%` }}
                                        ></div>
                                      </div>
                                    </div>

                                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
                                      <div className="flex justify-between items-center">
                                        <span className="font-bold text-slate-500 uppercase text-[10px]">Horómetro</span>
                                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                                          srv.vencido ? 'bg-rose-100 text-rose-700' : srv.proximo ? 'bg-amber-100 text-amber-800' : 'bg-slate-200 text-slate-700'
                                        }`}>
                                          -{srv.hrsRestantes}h
                                        </span>
                                      </div>
                                      <strong className="text-base font-extrabold block mt-1 text-slate-900">{moto.horometro.toFixed(1)} hrs</strong>
                                      <span className="text-[10px] text-slate-400 block mt-1">Próx: {srv.proximoServicioHrs}h</span>
                                    </div>
                                  </div>

                                  {/* Mantenimiento preventivo */}
                                  <div className="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 text-[11px]">
                                    <button
                                      type="button"
                                      onClick={() => handleRegistrarServicio50h(moto.numero)}
                                      className="flex-1 py-2 px-2 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-200 cursor-pointer transition text-center"
                                    >
                                      Servicio 50h
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => handleRegistrarLavadoAguaDulce(moto.numero)}
                                      className="py-2 px-3 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-200 cursor-pointer transition text-center"
                                    >
                                      Endulzado
                                    </button>
                                  </div>
                                </div>
                              </div>

                              {/* Acciones principales en el footer de la tarjeta */}
                              <div className="p-5 pt-0">
                                {disponible && (
                                  <div className="flex gap-2">
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const reservaParaEstaMoto =
                                          reservasPendientes.find(r => r.motoNum === moto.numero) ||
                                          reservasPendientes[0] ||
                                          null;
                                        abrirModalDespacho(
                                          moto,
                                          reservaParaEstaMoto ? reservaParaEstaMoto.slotRef : null,
                                          reservaParaEstaMoto
                                        );
                                      }}
                                      className="flex-1 py-3.5 bg-gradient-to-r from-[#E5097F] to-[#D00772] hover:brightness-105 active:scale-[0.99] text-white text-xs font-bold uppercase tracking-wider rounded-2xl cursor-pointer shadow-md shadow-[#E5097F]/20 transition"
                                    >
                                      Despachar al Agua
                                    </button>
                                    <button
                                      type="button"
                                      onClick={() => handleEnviarMotoATaller(moto.numero, 'Revisión preventiva / turbina')}
                                      className="px-3.5 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold uppercase rounded-2xl cursor-pointer transition"
                                    >
                                      Taller
                                    </button>
                                  </div>
                                )}
                                {enAgua && (
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setModalRetornoMoto(moto);
                                      setRetornoPunto(moto.ubicacion || 'parguito');
                                      setInputNuevoHorometro((moto.horometro + (moto.alquiler.duracionMin / 60)).toFixed(1));
                                    }}
                                    className="w-full py-3.5 bg-[#0D1B2A] hover:bg-black text-white text-xs font-bold uppercase tracking-wider rounded-2xl cursor-pointer shadow-md transition"
                                  >
                                    Registrar Retorno y Horómetro
                                  </button>
                                )}
                                {taller && (
                                  <button
                                    type="button"
                                    onClick={() => handleHabilitarMotoEnMuelle(moto.numero)}
                                    className="w-full py-3.5 bg-[#0284C7] hover:bg-[#0369A1] text-white text-xs font-bold uppercase tracking-wider rounded-2xl cursor-pointer shadow-md transition"
                                  >
                                    Habilitar Unidad en Muelle
                                  </button>
                                )}
                              </div>
                            </div>
                          );
                        })}
                      </div>

                      {/* COLA DE DESPACHO INMEDIATO PARA EL OPERADOR (POR UNIDAD #01, #02, #03) */}
                      <div className="bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/50 p-6 sm:p-8">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-slate-100 gap-2">
                          <div>
                            <span className="text-[11px] font-bold uppercase tracking-wider text-[#0284C7] block">
                              Cola Inmediata de Muelle
                            </span>
                            <h3 className="text-xl font-extrabold text-[#0D1B2A] mt-0.5">
                              Próximos Clientes por Abordar ({reservasPendientes.length})
                            </h3>
                          </div>
                          <button
                            type="button"
                            onClick={() => setTabOperador('agenda_admin')}
                            className="text-xs font-bold text-[#E5097F] hover:underline cursor-pointer self-start sm:self-auto"
                          >
                            Ver y Gestionar Agenda Completa →
                          </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-5">
                          {reservasPendientes.length === 0 ? (
                            <div className="col-span-3 text-center py-8 text-slate-400 text-xs font-medium">
                              No hay clientes en cola inmediata en este momento.
                            </div>
                          ) : (
                            reservasPendientes.slice(0, 6).map((resItem, idx) => {
                              const motoPreferida = motosDisponibles.find(m => m.numero === resItem.motoNum) || motosDisponibles[0];
                              return (
                                <div key={resItem.idReserva || idx} className="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col justify-between gap-3">
                                  <div>
                                    <div className="flex justify-between items-center">
                                      <span className="px-2.5 py-0.5 bg-[#0D1B2A] text-white rounded-full font-mono text-[10px] font-bold">
                                        Moto #{resItem.motoNum} • {resItem.horaInicioReal}
                                      </span>
                                      <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase ${
                                        resItem.puntoEmbarque === 'sunsol' ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800'
                                      }`}>
                                        {resItem.puntoEmbarque === 'sunsol' ? 'Sunsol' : 'Parguito'}
                                      </span>
                                    </div>
                                    <div className="flex items-center justify-between mt-2.5">
                                      <strong className="text-sm font-bold text-slate-900 uppercase block">{resItem.cli}</strong>
                                      <strong className="text-xs font-extrabold text-[#E5097F]">{resItem.duracionMin}m ({resItem.tarifaEUR}€)</strong>
                                    </div>
                                    <span className="text-xs text-slate-500 block mt-1">
                                      {resItem.toldo} • {resItem.personas === 2 ? '2 Personas' : '1 Piloto'} • Chaleco #{resItem.chaleco}
                                    {(() => {
                                      const w = firmasDia.find(f => f.nombre.toLowerCase().trim() === (resItem.cli || '').toLowerCase().trim());
                                      return w ? (
                                        <div className="mt-1.5 flex items-center justify-between text-[10px] bg-emerald-50 text-emerald-800 px-2 py-1 rounded-lg border border-emerald-200">
                                          <span className="font-bold flex items-center gap-1">
                                            <Icons.CheckCircle className="w-3.5 h-3.5 text-emerald-600" />
                                            Waiver Firmado ({w.id})
                                          </span>
                                          <button
                                            type="button"
                                            onClick={() => handleDescargarPDFContrato(w)}
                                            className="text-emerald-700 underline font-bold hover:text-emerald-900 cursor-pointer"
                                          >
                                            Ver PDF
                                          </button>
                                        </div>
                                      ) : (
                                        <div className="mt-1.5 text-[10px] bg-amber-50 text-amber-800 px-2 py-1 rounded-lg border border-amber-200 flex items-center gap-1">
                                          <Icons.AlertTriangle className="w-3.5 h-3.5 text-amber-600 shrink-0" />
                                          <span>Sin firma digital a
ú
n</span>
                                        </div>
                                      );
                                    })()}
                                    </span>
                                  </div>

                                  <div className="flex gap-2 pt-1 border-t border-slate-200">
                                    {motoPreferida && (
                                      <button
                                        type="button"
                                        onClick={() => abrirModalDespacho(motoPreferida, resItem.slotRef, resItem)}
                                        className="flex-1 py-2 bg-gradient-to-r from-[#E5097F] to-[#D00772] hover:brightness-105 text-white rounded-xl text-xs font-bold uppercase cursor-pointer shadow-xs transition"
                                      >
                                        Lanzar #{motoPreferida.numero}
                                      </button>
                                    )}
                                    <button
                                      type="button"
                                      onClick={() => handleEliminarCitaSlot(resItem.slotId, resItem.idReserva)}
                                      className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold uppercase cursor-pointer transition"
                                    >
                                      Quitar
                                    </button>
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* SUB-MÓDULO 2: ADMINISTRACIÓN COMPLETA DE LA AGENDA (CONTROL DE LAS 3 MOTOS POR HORARIO) */}
                  {tabOperador === 'agenda_admin' && (
                    <div className="space-y-6">
                      {/* RESUMEN SEMANAL DE JORNADA OPERATIVA (VIERNES A DOMINGO) */}
                      <div className="bg-gradient-to-r from-[#0D1B2A] to-[#1E3A8A] text-white p-5 rounded-2xl shadow-lg space-y-4">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-[#E5097F] text-white font-condensed text-[10px] font-bold uppercase tracking-widest">
                                PROGRAMACIÓN SEMANAL
                              </span>
                              <span className="text-xs text-[#7DD3FC] font-mono">3 Motos Operativas (#01, #02, #03)</span>
                            </div>
                            <h3 className="font-condensed text-2xl font-bold uppercase mt-1">
                              JORNADA OPERATIVA DE VIERNES A DOMINGO
                            </h3>
                            <p className="text-xs text-white/80">
                              Resumen de citas agendadas, capacidad disponible e ingresos previstos para el fin de semana.
                            </p>
                          </div>

                          {/* Selector rápido de fecha de administración */}
                          <div className="flex items-center gap-1.5 flex-wrap">
                            {diasOperativos.lista.map(d => {
                              const activo = fechaSeleccionada === d.fecha;
                              return (
                                <button
                                  key={d.id}
                                  type="button"
                                  onClick={() => setFechaSeleccionada(d.fecha)}
                                  className={`px-3 py-1.5 rounded-lg font-condensed text-xs font-bold uppercase cursor-pointer transition-all ${
                                    activo
                                      ? 'bg-[#E5097F] text-white shadow ring-2 ring-white'
                                      : 'bg-white/10 hover:bg-white/20 text-white'
                                  }`}
                                >
                                  {d.etiqueta} ({d.corta.split(' ')[1]} {d.corta.split(' ')[2]})
                                </button>
                              );
                            })}
                            <input
                              type="date"
                              value={fechaSeleccionada}
                              onChange={(e) => e.target.value && setFechaSeleccionada(e.target.value)}
                              className="bg-white/10 hover:bg-white/20 text-white px-2.5 py-1 rounded-lg text-xs font-mono font-bold cursor-pointer outline-none border border-white/20"
                            />
                          </div>
                        </div>

                        {/* 3 Tarjetas de Resumen para Viernes, Sábado y Domingo */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3.5 pt-2">
                          {[
                            { dia: diasOperativos.viernes, borderCol: 'border-[#1DA1DB]' },
                            { dia: diasOperativos.sabado, borderCol: 'border-[#E5097F]' },
                            { dia: diasOperativos.domingo, borderCol: 'border-[#8FD6F2]' }
                          ].map(({ dia, borderCol }) => {
                            const stats = obtenerEstadisticasFecha(dia.fecha);
                            const esSeleccionado = fechaSeleccionada === dia.fecha;
                            return (
                              <div
                                key={dia.id}
                                onClick={() => setFechaSeleccionada(dia.fecha)}
                                className={`p-4 rounded-xl border bg-white/5 backdrop-blur-sm cursor-pointer transition-all ${
                                  esSeleccionado
                                    ? `ring-2 ring-[#E5097F] bg-white/15 shadow-md ${borderCol}`
                                    : 'hover:bg-white/10 border-white/15'
                                }`}
                              >
                                <div className="flex items-center justify-between">
                                  <span className="font-condensed font-bold text-sm uppercase text-[#7DD3FC]">
                                    {dia.nombreDia}
                                  </span>
                                  <span className="text-[11px] font-mono text-white/70">{dia.corta}</span>
                                </div>

                                <div className="mt-2.5 flex items-baseline justify-between">
                                  <div>
                                    <span className="text-2xl font-mono font-black text-white">{stats.totalReservas}</span>
                                    <span className="text-xs text-white/70 ml-1.5 font-condensed uppercase">Paseos Agendados</span>
                                  </div>
                                  <div className="text-right">
                                    <span className="text-base font-mono font-bold text-[#E5097F]">{stats.totalEUR}€</span>
                                    <span className="block text-[10px] font-mono text-white/60">Bs. {stats.totalBs}</span>
                                  </div>
                                </div>

                                <div className="mt-3 pt-2.5 border-t border-white/10 flex items-center justify-between text-[11px] text-white/80">
                                  <span>Motos activas: <strong>{stats.motosConCitas.length > 0 ? stats.motosConCitas.map(n => `#${n}`).join(', ') : 'Libres'}</strong></span>
                                  <span className="text-[#7DD3FC] font-bold">{stats.slotsConDisponibilidad} salidas con cupos libres</span>
                                </div>

                                <button
                                  type="button"
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    setFechaSeleccionada(dia.fecha);
                                  }}
                                  className={`w-full mt-3 py-1.5 rounded-lg font-condensed text-xs font-bold uppercase transition-all cursor-pointer ${
                                    esSeleccionado
                                      ? 'bg-[#E5097F] text-white'
                                      : 'bg-white/10 hover:bg-white/20 text-white'
                                  }`}
                                >
                                  {esSeleccionado ? 'Mostrando este día' : `Ver Agenda ${dia.nombreDia}`}
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* BARRA DE FILTROS Y CONTROL DE JORNADA */}
                      <div className="bg-white p-5 border border-slate-300 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3 flex-wrap">
                          <div className="flex items-center gap-2">
                            {['manana', 'tarde', 'todos'].map(j => (
                              <button
                                key={j}
                                type="button"
                                onClick={() => setFiltroJornada(j)}
                                className={`px-4 py-2 font-condensed text-xs font-bold uppercase cursor-pointer ${
                                  filtroJornada === j ? 'bg-[#E5097F] text-white' : 'bg-slate-100 text-slate-700'
                                }`}
                              >
                                {j === 'manana' ? 'MAÑANA' : j === 'tarde' ? 'TARDE' : 'TODOS LOS HORARIOS'}
                              </button>
                            ))}
                          </div>

                          <div className="px-3 py-1.5 bg-[#F0F9FF] border border-[#BAE6FD] text-[#0284C7] rounded-lg text-xs font-mono font-bold">
                            Viendo: {formatFechaBonita(fechaSeleccionada)} ({obtenerEstadisticasFecha(fechaSeleccionada).totalReservas} reservas)
                          </div>
                        </div>

                        <button
                          type="button"
                          onClick={() => {
                            setModalNuevoHorario(true);
                            setErrorCapitania('');
                          }}
                          className="px-5 py-2.5 bg-[#0D1B2A] text-white font-condensed text-xs font-bold uppercase tracking-wider cursor-pointer"
                        >
                          + AGREGAR HORARIO PERSONALIZADO
                        </button>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {slots
                          .filter(s => filtroJornada === 'todos' || s.jornada === filtroJornada)
                          .map(slot => {
                            const ev = evaluarEstadoSlot(slot, fechaSeleccionada);
                            return (
                              <div key={slot.id} className="bg-white border border-slate-300 p-4 flex flex-col justify-between space-y-3">
                                <div>
                                  <div className="flex justify-between items-start pb-2 border-b border-slate-200">
                                    <div>
                                      <div className="flex items-center gap-2 flex-wrap">
                                        <strong className="font-mono text-xl font-black text-[#0D1B2A]">{ev.horaInicioReal}</strong>
                                        {METADATA_ZARPES_WEB[slot.minutos || slot.minFijo] ? (
                                          <span className="px-2 py-0.5 rounded-full bg-[#E5097F]/10 border border-[#E5097F]/30 text-[#E5097F] text-[9px] font-mono font-bold uppercase">
                                            Salida #{METADATA_ZARPES_WEB[slot.minutos || slot.minFijo].num} • {METADATA_ZARPES_WEB[slot.minutos || slot.minFijo].tag}
                                          </span>
                                        ) : (
                                          <span className="px-2 py-0.5 rounded-full bg-slate-100 border border-slate-300 text-slate-600 text-[9px] font-mono font-bold uppercase">
                                            Turno Especial
                                          </span>
                                        )}
                                      </div>
                                      {METADATA_ZARPES_WEB[slot.minutos || slot.minFijo] && (
                                        <span className="text-[10px] text-[#0284C7] font-semibold block mt-0.5">
                                          {METADATA_ZARPES_WEB[slot.minutos || slot.minFijo].sub} • {METADATA_ZARPES_WEB[slot.minutos || slot.minFijo].desc}
                                        </span>
                                      )}
                                      <span className="block text-[10px] font-mono text-slate-400 mt-0.5">
                                        Capacidad: {ev.cantOcupadas}/3 ocupadas • {ev.cantLibres}/3 libres
                                      </span>
                                    </div>
                                    <span className={`px-2 py-0.5 text-[10px] font-condensed font-bold uppercase ${
                                      ev.todasOcupadas
                                        ? 'bg-[#E5097F] text-white'
                                        : ev.parcialmenteOcupado
                                        ? 'bg-[#8FD6F2] text-[#0D1B2A]'
                                        : 'bg-[#0D1B2A] text-white'
                                    }`}>
                                      {ev.texto}
                                    </span>
                                  </div>

                                  {/* DETALLE DE LAS 3 UNIDADES (#01, #02, #03) EN ESTE HORARIO */}
                                  <div className="pt-2 space-y-2">
                                    {ev.detalleMotos.map(dm => {
                                      const r = dm.reserva;
                                      const esReservaDeEsteSlot = r && dm.slotOrigenId === slot.id;
                                      const motoDispObj = motosDisponibles.find(m => m.numero === dm.numero) || motosDisponibles[0];

                                      return (
                                        <div
                                          key={dm.numero}
                                          className={`p-2.5 border text-xs ${
                                            dm.disponible
                                              ? 'bg-[#8FD6F2]/15 border-[#1DA1DB]/40'
                                              : dm.estado === 'en_agua'
                                              ? 'bg-[#E5097F]/10 border-[#E5097F]'
                                              : 'bg-slate-50 border-slate-200'
                                          }`}
                                        >
                                          <div className="flex items-center justify-between">
                                            <span className="font-mono text-[10px] font-bold uppercase text-[#0D1B2A]">
                                              MOTO #{dm.numero}
                                            </span>
                                            <span className={`px-1.5 py-0.5 text-[9px] font-condensed font-bold uppercase ${
                                              dm.disponible
                                                ? 'bg-[#1DA1DB] text-white'
                                                : dm.estado === 'en_agua'
                                                ? 'bg-[#E5097F] text-white'
                                                : 'bg-[#0D1B2A] text-[#8FD6F2]'
                                            }`}>
                                              {dm.disponible
                                                ? 'LIBRE'
                                                : dm.estado === 'en_agua'
                                                ? `EN AGUA (${r ? r.duracionMin : 15}M)`
                                                : dm.estado === 'taller'
                                                ? 'EN TALLER'
                                                : `RESERVADA (${r ? r.duracionMin : 15}M)`}
                                            </span>
                                          </div>

                                          {r ? (
                                            <div className="mt-1.5 space-y-1.5">
                                              <div>
                                                <strong className="font-condensed text-sm uppercase block text-[#0D1B2A]">
                                                  {r.cli} {!esReservaDeEsteSlot ? '(Viene de turno anterior)' : ''}
                                                </strong>
                                                <span className="text-[11px] text-slate-500 block">
                                                  {r.toldo} • Chaleco #{r.chaleco} • Se desocupa: <strong className="text-[#E5097F]">{dm.horaSeDesocupa || dm.horaLibreReal}</strong>
                                                </span>
                                              </div>

                                              {r.referenciaPago && (
                                                <div className="flex items-center justify-between gap-1 bg-white px-2 py-1 border border-slate-200 text-[10px] font-mono">
                                                  <span>Ref: <strong>#{r.referenciaPago}</strong></span>
                                                  {r.captureDataUrl ? (
                                                    <button
                                                      type="button"
                                                      onClick={() =>
                                                        setModalVerCapture({
                                                          cliente: r.cli,
                                                          referencia: r.referenciaPago,
                                                          horarioTurno: `${ev.horaInicioReal} (${r.duracionMin}m • Moto #${dm.numero})`,
                                                          montoEUR: r.tarifaEUR,
                                                          captureDataUrl: r.captureDataUrl,
                                                          slotId: dm.slotOrigenId,
                                                          verificado: !!r.pagoVerificado
                                                        })
                                                      }
                                                      className="px-1.5 py-0.5 bg-[#E5097F] text-white font-condensed uppercase font-bold cursor-pointer"
                                                    >
                                                      Ver Capture
                                                    </button>
                                                  ) : (
                                                    <span className="text-[#1DA1DB] font-bold">Registrado</span>
                                                  )}
                                                </div>
                                              )}

                                              {esReservaDeEsteSlot && (
                                                <>
                                                  <div className="grid grid-cols-4 gap-1 pt-0.5">
                                                    {[15, 20, 30, 40].map(m => (
                                                      <button
                                                        key={m}
                                                        type="button"
                                                        onClick={() => handleCambiarDuracionSlot(slot.id, m, r.idReserva)}
                                                        className={`py-0.5 font-mono text-[10px] font-bold border cursor-pointer ${
                                                          r.duracionMin === m
                                                            ? 'bg-[#E5097F] text-white border-[#E5097F]'
                                                            : 'bg-white text-slate-700 border-slate-200'
                                                        }`}
                                                      >
                                                        {m}m
                                                      </button>
                                                    ))}
                                                  </div>

                                                  <div className="flex gap-1 pt-1">
                                                    {dm.estado !== 'en_agua' && !ev.esPasado && motoDispObj && (
                                                      <button
                                                        type="button"
                                                        onClick={() => abrirModalDespacho(motoDispObj, slot, r)}
                                                        className="flex-1 py-1 bg-[#E5097F] text-white font-condensed text-[10px] font-bold uppercase cursor-pointer"
                                                      >
                                                        LANZAR #{dm.numero}
                                                      </button>
                                                    )}
                                                    <button
                                                      type="button"
                                                      onClick={() =>
                                                        setModalTicketDetalle({
                                                          ...slot,
                                                          cli: r.cli,
                                                          toldo: r.toldo,
                                                          chaleco: r.chaleco,
                                                          duracionMin: r.duracionMin,
                                                          tarifaEUR: r.tarifaEUR
                                                        })
                                                      }
                                                      className="px-2 py-1 bg-[#0D1B2A] text-white font-condensed text-[10px] font-bold uppercase cursor-pointer"
                                                    >
                                                      TICKET
                                                    </button>
                                                    <button
                                                      type="button"
                                                      onClick={() => handleEliminarCitaSlot(slot.id, r.idReserva)}
                                                      className="px-2 py-1 bg-[#E5097F]/15 text-[#E5097F] font-condensed text-[10px] font-bold uppercase cursor-pointer"
                                                    >
                                                      BORRAR
                                                    </button>
                                                  </div>
                                                </>
                                              )}
                                            </div>
                                          ) : (
                                            <div className="mt-1 flex items-center justify-between gap-1">
                                              <span className="text-[11px] font-mono text-[#0284C7] font-bold">
                                                {ev.esPasado ? 'Horario concluido' : dm.textoLibre || `Unidad #${dm.numero} disponible`}
                                              </span>
                                              {!ev.esPasado && dm.disponible && (
                                                <button
                                                  type="button"
                                                  onClick={() => {
                                                    setModalReservarSlot(slot);
                                                    setReservaMotoNum(dm.numero);
                                                    setReservaMotosSeleccionadas([dm.numero]);
                                                    setReservaCantidadMotos(1);
                                                    setReservaDuracion(15);
                                                  }}
                                                  className="px-2 py-0.5 bg-[#1DA1DB] text-white font-condensed text-[10px] font-bold uppercase cursor-pointer"
                                                >
                                                  + Agendar #{dm.numero}
                                                </button>
                                              )}
                                            </div>
                                          )}
                                        </div>
                                      );
                                    })}
                                  </div>
                                </div>

                                <div className="pt-2 border-t border-slate-100">
                                  {!ev.esPasado && ev.cantLibres > 0 ? (
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const inicial = ev.motosLibres[0] || '01';
                                        setModalReservarSlot(slot);
                                        setReservaMotoNum(inicial);
                                        setReservaMotosSeleccionadas([inicial]);
                                        setReservaCantidadMotos(1);
                                        setReservaDuracion(15);
                                      }}
                                      className="w-full py-2 bg-[#1DA1DB] hover:bg-[#0D1B2A] text-white font-condensed text-xs font-bold uppercase cursor-pointer"
                                    >
                                      + AGENDAR EN MOTO LIBRE ({ev.motosLibres.map(n => `#${n}`).join(', ')})
                                    </button>
                                  ) : (
                                    <span className="block text-center text-[11px] font-condensed uppercase text-slate-400">
                                      {ev.esPasado ? 'Turno Concluido' : '3/3 Motos Ocupadas en este horario'}
                                    </span>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                      </div>
                    </div>
                  )}

                  {/* SUB-MÓDULO 3: ARQUEO DE CAJA, AJUSTE TASA BCV Y BACKEND DE CAPTURES RECIBIDOS */}
                  {tabOperador === 'caja_admin' && (
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      <div className="lg:col-span-5 bg-white p-6 border border-slate-300 space-y-5">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                          <h3 className="font-condensed text-xl font-bold uppercase text-[#0D1B2A]">
                            AJUSTE BCV & CALCULADORA DE VUELTO
                          </h3>
                          <button
                            type="button"
                            onClick={() => setEditandoTasa(!editandoTasa)}
                            className="text-xs font-bold text-[#E5097F] underline cursor-pointer"
                          >
                            {editandoTasa ? 'Cerrar' : `Editar Tasa (${tasaEUR.toFixed(2)})`}
                          </button>
                        </div>

                        {editandoTasa && (
                          <div className="p-3 bg-slate-100 flex items-center justify-between gap-2">
                            <span className="text-xs font-bold">Nueva Tasa Euro BCV:</span>
                            <div className="flex gap-1.5">
                              <input
                                type="number"
                                step="0.01"
                                value={inputTasaManual}
                                onChange={e => setInputTasaManual(e.target.value)}
                                className="w-24 px-2 py-1 border border-slate-400 font-mono text-xs"
                              />
                              <button
                                type="button"
                                onClick={() => {
                                  const v = parseFloat(inputTasaManual);
                                  if (!isNaN(v) && v > 0) setTasaEUR(v);
                                  setEditandoTasa(false);
                                }}
                                className="px-3 py-1 bg-[#E5097F] text-white text-xs font-bold cursor-pointer"
                              >
                                GUARDAR
                              </button>
                            </div>
                          </div>
                        )}

                        <form onSubmit={handleRegistrarCobroManual} className="space-y-4">
                          <div className="grid grid-cols-4 gap-2">
                            {TARIFAS_OFICIALES.map(t => (
                              <button
                                key={t.min}
                                type="button"
                                onClick={() => setCalcDuracion(t.min)}
                                className={`p-2.5 border text-center font-condensed cursor-pointer ${
                                  calcDuracion === t.min ? 'bg-[#E5097F] text-white border-[#E5097F]' : 'bg-slate-50 text-black border-slate-300'
                                }`}
                              >
                                <div className="text-sm font-bold">{t.min}M</div>
                                <div className="text-xs font-mono">{t.eur}€</div>
                              </button>
                            ))}
                          </div>

                          <div className="p-4 bg-[#0D1B2A] text-white flex justify-between items-center">
                            <div>
                              <span className="text-[10px] font-mono uppercase text-[#8FD6F2] block">A Cobrar:</span>
                              <strong className="font-mono text-2xl font-black text-[#8FD6F2]">{montoCalculadoraEUR}€</strong>
                            </div>
                            <div className="text-right">
                              <span className="text-[10px] font-mono uppercase text-[#8FD6F2] block">En Bolívares BCV:</span>
                              <strong className="font-mono text-xl font-black text-white">Bs. {montoCalculadoraBs.toFixed(2)}</strong>
                            </div>
                          </div>

                          <div>
                            <label className="text-xs font-bold uppercase text-slate-600 block mb-1">
                              Billete entregado por el cliente (€) para calcular vuelto:
                            </label>
                            <input
                              type="number"
                              placeholder="Ej: 50 o 100"
                              value={calcRecibidoEUR}
                              onChange={e => setCalcRecibidoEUR(e.target.value)}
                              className="w-full px-3.5 py-2 border border-slate-300 font-mono text-xs"
                            />
                            {vueltoEUR > 0 && (
                              <div className="mt-2 p-3 bg-[#8FD6F2]/20 border border-[#1DA1DB] text-xs font-mono flex justify-between">
                                <span>Vuelto en €: <strong>{vueltoEUR.toFixed(2)}€</strong></span>

                          <button
                            type="submit"

                          </button>

                      <div className="lg:col-span-7 bg-white p-6 border border-slate-300 space-y-4">
                        {(() => {
                          const ventasFiltradas = ventasDia.filter(
                            v => filtroFechaCaja === 'todos' || (v.fecha || fechaHoyISO) === filtroFechaCaja
