                        <div key={moto.id} className="group flex flex-col justify-between border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm p-3.5 sm:p-0">
                          <div>
                            <div className="relative h-48 sm:h-56 w-full bg-gradient-to-b from-[#0D1B2A] via-[#112233] to-[#0A1420] overflow-hidden rounded-xl sm:rounded-none flex items-center justify-center p-3">
                              <img
                                src={moto.imagen || "yamaha_waverunner_real.png"}
                                alt={moto.nombre}
                                className="max-h-36 sm:max-h-44 w-auto object-contain drop-shadow-[0_15px_25px_rgba(0,0,0,0.85)] group-hover:scale-105 transition-transform duration-500 relative z-10"
                              />
                              <div className="absolute inset-0 bg-gradient-to-t from-[#0D1B2A]/60 via-transparent to-transparent pointer-events-none"></div>

                              <div className="absolute top-2.5 right-2.5">
                                <span className={`px-2.5 py-1 text-[9px] sm:text-[10px] font-condensed uppercase tracking-wider font-bold rounded ${
                                  taller
                                    ? 'bg-amber-600 text-white'
                                    : enAgua
                                    ? 'bg-[#E5097F] text-white animate-pulse'
                                    : disponible
                                    ? 'bg-[#1DA1DB] text-white'
                                    : 'bg-slate-700 text-slate-200'
                                }`}>
                                  {taller ? 'EN MANTENIMIENTO' : enAgua ? 'EN EL AGUA' : disponible ? 'LISTA EN ORILLA' : 'EN REVISIÓN'}
                                </span>
                              </div>

                              <div className="absolute top-2.5 left-2.5 flex flex-col gap-1">
                                <span className="font-condensed font-bold text-xs bg-[#0D1B2A]/90 text-[#8FD6F2] px-2 py-0.5 rounded">
                                  MOTO #{moto.numero}
                                </span>
                                <span className="font-mono text-[8px] sm:text-[9px] font-bold uppercase bg-[#1DA1DB]/90 text-white px-1.5 py-0.5 rounded">
                                  {moto.ubicacion === 'sunsol' ? 'SUNSOL ISLA CARIBE' : 'PLAYA PARGUITO'}
                                </span>
                              </div>

                              {/* ETIQUETA INFERIOR PRECIO / TIMER */}
                              <div className={`absolute bottom-0 left-0 w-36 sm:w-44 h-24 sm:h-32 corner-ribbon-red flex flex-col justify-end p-2.5 sm:p-3.5 text-white ${
                                taller ? 'bg-amber-600' : enAgua ? 'bg-[#E5097F]' : 'bg-[#1DA1DB]'
                              }`}>
                                {taller ? (
                                  <>
                                    <span className="font-condensed font-bold text-lg leading-none">
                                      TALLER
                                    </span>
                                    <span className="text-[8px] font-condensed uppercase tracking-widest opacity-90 mt-0.5">
                                      PREVENTIVO
                                    </span>
                                  </>
                                ) : enAgua ? (
                                  <>
                                    <span className="font-mono font-black text-xl sm:text-2xl leading-none">
                                      {timer.txt}
                                    </span>
                                    <span className="text-[8px] sm:text-[9px] font-condensed uppercase tracking-widest opacity-90 mt-0.5">
                                      VUELVE EN MINUTOS
                                    </span>
                                  </>
                                ) : (
                                  <>
                                    <span className="font-condensed font-bold text-2xl sm:text-3xl leading-none">
                                      30€
                                    </span>
                                    <span className="text-[8px] sm:text-[9px] font-condensed uppercase tracking-widest opacity-90 mt-0.5">
                                      PASEO 15 MIN
                                    </span>
                                  </>
                                )}
                              </div>
                            </div>

                            <div className="pt-3 sm:pt-5 space-y-1.5 sm:space-y-2.5">
                              <div>
                                <h3 className="font-condensed text-lg sm:text-xl font-bold uppercase text-[#0D1B2A]">
                                  {moto.nombre}
                                </h3>
                                <p className="text-[10px] sm:text-[11px] font-bold text-[#E5097F] uppercase tracking-wider">
                                  {moto.subtitulo}
                                </p>
                              </div>

                              <p className="text-xs text-slate-500 line-clamp-2 sm:line-clamp-none">
                                {moto.descripcionCliente}
                              </p>

                              <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] sm:text-xs font-mono">
                                <span className="text-slate-500">15m: <strong className="text-[#0D1B2A]">30€</strong> • 20m: <strong className="text-[#0D1B2A]">40€</strong></span>
                                <span className="text-slate-500">30m: <strong className="text-[#0D1B2A]">60€</strong></span>
                              </div>
                            </div>
                          </div>

                          <div className="pt-3 sm:pt-5">
                            {taller ? (
                              <span className="block text-center py-2 rounded-full bg-slate-100 text-slate-400 font-condensed font-bold text-xs uppercase tracking-widest">
                                UNIDAD EN MANTENIMIENTO
                              </span>
                            ) : (
                              <a
                                href="#cli-precios"
                                onClick={() => {
                                  setCalcMotosSeleccionadas([moto.numero]);
                                  setReservaMotoNum(moto.numero);
                                }}
                                className="block text-center w-full py-2 sm:py-2.5 rounded-full bg-[#E5097F] hover:bg-[#C8066C] text-white font-condensed font-bold text-xs uppercase tracking-widest shadow transition-all"
                              >
                                RESERVAR ESTA UNIDAD
                              </a>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* ----------------------------------------------------------- */}
                {/* 3. SECCIÓN FUCSIA & BLANCA: CÓMO FUNCIONA Y TURNOS EN VIVO  */}
                {/* ----------------------------------------------------------- */}
                <section id="cli-cola" className="relative grid grid-cols-1 lg:grid-cols-12 bg-white border-t border-b border-slate-200">

                  <div className="lg:col-span-6 bg-[#E5097F] text-white px-4 sm:px-14 py-8 sm:py-12 flex flex-col justify-between space-y-4 sm:space-y-6">
                    <div className="space-y-1.5 lg:pr-12">
                      <h2 className="font-condensed text-2xl sm:text-4xl font-bold uppercase tracking-wide">
                        ¿CÓMO FUNCIONA TU RESERVA?
                      </h2>
                      <p className="text-xs text-white/90 leading-relaxed">
                        Aparta tu hora exacta desde la comodidad de tu toldo en Playa Parguito o Sunsol Isla Caribe sin hacer cola bajo el sol.
                      </p>
                    </div>

                    <div className="space-y-3 lg:pr-14">
                      <div className="border-b border-white/20 pb-2.5">
                        <h4 className="font-condensed text-base sm:text-lg font-bold uppercase text-[#8FD6F2]">
                          1. Tarifas Oficiales en Euros o Pago Móvil BCV
                        </h4>
                        <p className="text-xs text-white/90 mt-0.5">
                          <strong>15m (30€)</strong> • <strong>20m (40€)</strong> • <strong>30m (60€)</strong> • <strong>40m (80€)</strong> (1 o 2 personas por moto con chalecos incluidos).
                        </p>
                      </div>

                      <div className="border-b border-white/20 pb-2.5">
                        <h4 className="font-condensed text-base sm:text-lg font-bold uppercase text-[#8FD6F2]">
                          2. Alarma Sonora 5 Minutos Antes
                        </h4>
                        <p className="text-xs text-white/90 mt-0.5">
                          Tu teléfono suena automáticamente para que camines hacia la orilla justo al momento de embarcar.
                        </p>
                      </div>

                      <div>
                        <h4 className="font-condensed text-base sm:text-lg font-bold uppercase text-[#8FD6F2]">
                          3. Firma Digital desde tu Celular
                        </h4>
                        <p className="text-xs text-white/90 mt-0.5">
                          Adelanta tu firma en el contrato digital de abajo para ahorrar tiempo al llegar a la orilla.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* MOTO DE AGUA CENITAL CENTRAL */}
                  <div className="hidden lg:flex absolute inset-y-0 left-1/2 -translate-x-1/2 z-20 items-center justify-center pointer-events-none">
                    <Icons.JetSkiTopDown className="w-36 h-auto drop-shadow-2xl" />
                  </div>

                  {/* DERECHA BLANCA: COLA DE TURNOS EN VIVO */}
                  <div className="lg:col-span-6 bg-white px-4 sm:px-14 py-8 sm:py-12 flex flex-col justify-between space-y-4 sm:space-y-6">
                    <div className="lg:pl-12">
                      <h3 className="font-condensed text-2xl sm:text-3xl font-bold uppercase text-[#0D1B2A]">
                        TURNOS <span className="text-[#1DA1DB]">EN VIVO EN EL MAR</span>
                      </h3>
                      <p className="text-xs text-slate-500">
                        Visualiza los turnos activos en tiempo real y la hora exacta de desocupación de cada unidad.
                      </p>
                    </div>

                    <div className="lg:pl-12 space-y-3 sm:space-y-4">
                      {(() => {
                        const turnosActivosYCola = slots.filter(s => {
                          const ev = evaluarEstadoSlot(s);
                          return !ev.esPasado && ev.cantOcupadas > 0;
                        });
                        if (turnosActivosYCola.length === 0) {
                          return (
                            <div className="p-6 border border-dashed border-[#1DA1DB] bg-[#8FD6F2]/15 text-center text-xs text-[#0D1B2A] font-bold">
                              ¡Las 3 motos están libres en este momento! Puedes bajar o apartar el próximo horario de inmediato.
                            </div>
                          );
                        }
                        return turnosActivosYCola.slice(0, 3).map((turno, idx) => {
                          const ev = evaluarEstadoSlot(turno);
                          const esMio = miTicketClienteId === turno.id;
                          return (
                            <div key={turno.id} className="flex items-center gap-4 pb-4 border-b border-slate-100 last:border-b-0">
                              <div className={`w-16 h-16 rounded-full text-white border-4 flex flex-col items-center justify-center shrink-0 shadow ${
                                ev.esEnAgua ? 'bg-[#E5097F] border-[#8FD6F2]' : esMio ? 'bg-[#E5097F] border-[#8FD6F2]' : 'bg-[#0D1B2A] border-[#8FD6F2]'
                              }`}>
                                <span className="font-condensed text-[9px] uppercase text-[#8FD6F2] font-bold leading-none">
                                  {ev.cantOcupadas}/3 OCUP.
                                </span>
                                <strong className="font-mono text-xs font-extrabold mt-0.5">
                                  {ev.horaInicioReal.replace(' AM', '').replace(' PM', '')}
                                </strong>
                              </div>

                              <div className="flex-1 min-w-0 space-y-1">
                                <div className="flex items-center gap-2 flex-wrap">
                                  <h4 className="font-condensed text-base font-bold uppercase text-[#0D1B2A] truncate">
                                    {ev.motosOcupadas
                                      .map(m =>
                                        `Moto #${m.numero}: ${
                                          esMio && m.reserva && m.reserva.idReserva === miReservaClienteId
                                            ? `${m.reserva.cli} (TÚ)`
                                            : anonimizarNombre(m.reserva ? m.reserva.cli : turno.cli)
                                        } (${m.reserva ? m.reserva.duracionMin : turno.duracionMin}m • Libre ${m.horaSeDesocupa || ''})`
                                      )
                                      .join(' • ')}
                                  </h4>
                                </div>
                                <p className="text-xs text-slate-500">
                                  Horario: <strong>{ev.horaInicioReal}</strong> •{' '}
                                  {ev.cantLibres > 0 ? (
                                    <strong className="text-[#1DA1DB]">
                                      Quedan {ev.cantLibres} de 3 motos LIBRES ({ev.motosLibres.map(n => {
                                        const ml = ev.detalleMotos.find(d => d.numero === n);
                                        return `#${n}${ml && ml.horaLibreDesde ? ` (desde ${ml.horaLibreDesde})` : ''}`;
                                      }).join(', ')})
                                    </strong>
                                  ) : (
                                    <strong className="text-[#E5097F]">
                                      3/3 Motos Ocupadas • Próxima libre: {ev.horaLibreReal}
                                    </strong>
                                  )}
                                </p>
                              </div>
                            </div>
                          );
                        });
                      })()}
                    </div>
                  </div>
                </section>

                {/* ----------------------------------------------------------- */}
                {/* 5. CALCULADORA BCV, SELECCIÓN DE MOTOS Y AGENDAMIENTO       */}
                {/* ----------------------------------------------------------- */}
                <section id="cli-precios" className="bg-[#F7F8FA] text-[#0D1B2A] border-t border-slate-200 py-12 sm:py-20 px-4 sm:px-8">
                  {/* ENCABEZADO SOBRIO */}
                  <div className="max-w-2xl mx-auto text-center mb-10 sm:mb-14">
                    <span className="text-[11px] font-semibold tracking-[0.2em] uppercase text-slate-400">
                      Reserva online
                    </span>
                    <h2 className="mt-2 text-3xl sm:text-4xl font-bold tracking-tight text-[#0D1B2A]">
                      Reserva tu salida
                    </h2>
                    <p className="mt-3 text-sm text-slate-500 leading-relaxed">
                      4 salidas programadas al día. Al reservar por aquí recibes{' '}
                      <span className="font-semibold text-[#0D1B2A]">5 minutos adicionales</span> de cortesía.
                    </p>
                  </div>

                  <div className="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    {/* COLUMNA IZQUIERDA: SELECCIÓN */}
                    <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">

                      {/* 01 · DURACIÓN */}
                      <div className="p-5 sm:p-7">
                        <p className="text-[11px] font-semibold tracking-[0.15em] uppercase text-slate-400 mb-4">
                          01 · Duración
                        </p>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                          {TARIFAS_OFICIALES.map(t => {
                            const activo = calcDuracion === t.min;
                            return (
                              <button
                                key={t.min}
                                type="button"
                                onClick={() => setCalcDuracion(t.min)}
                                className={`p-4 rounded-xl text-left transition-colors cursor-pointer border ${
                                  activo
                                    ? 'border-[#0D1B2A] bg-[#0D1B2A] text-white'
                                    : 'border-slate-200 bg-white hover:border-slate-300 text-[#0D1B2A]'
                                }`}
                              >
                                <span className={`text-xs font-medium ${activo ? 'text-slate-300' : 'text-slate-500'}`}>
                                  {t.min} min
                                </span>
                                <span className="block text-2xl font-bold mt-0.5">{t.eur} €</span>
                                <span className={`block text-[11px] mt-2 ${activo ? 'text-slate-400' : 'text-slate-400'}`}>
                                  Navegas {t.min + PROMO_MINUTOS_EXTRA_WEB} min
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      </div>

                      {/* 02 · FECHA */}
                      <div className="p-5 sm:p-7">
                        <p className="text-[11px] font-semibold tracking-[0.15em] uppercase text-slate-400 mb-4">
                          02 · Fecha
                        </p>
                        <div className="flex items-center gap-2 flex-wrap">
                          {diasOperativos.lista.map(d => {
                            const activo = (pagoFecha || fechaSeleccionada) === d.fecha;
                            return (
                              <button
                                key={d.id}
                                type="button"
                                onClick={() => {
                                  setPagoFecha(d.fecha);
                                  setFechaSeleccionada(d.fecha);
                                  setPagoSlotIdSeleccionado('');
                                }}
                                className={`px-4 py-2.5 rounded-xl text-left transition-colors cursor-pointer border ${
                                  activo
                                    ? 'border-[#0D1B2A] bg-[#0D1B2A] text-white'
                                    : 'border-slate-200 bg-white hover:border-slate-300 text-[#0D1B2A]'
                                }`}
                              >
                                <span className="block text-sm font-semibold leading-tight">{d.etiqueta}</span>
                                <span className={`block text-[11px] ${activo ? 'text-slate-400' : 'text-slate-400'}`}>{d.corta}</span>
                              </button>
                            );
                          })}
                          <label className="flex items-center gap-2 px-4 py-3 rounded-xl border border-slate-200 bg-white hover:border-slate-300 cursor-pointer">
                            <Icons.Calendar className="w-4 h-4 text-slate-400" />
                            <input
                              type="date"
                              value={pagoFecha || fechaSeleccionada}
                              onChange={(e) => {
                                if (e.target.value) {
                                  setPagoFecha(e.target.value);
                                  setFechaSeleccionada(e.target.value);
                                  setPagoSlotIdSeleccionado('');
                                }
                              }}
                              className="text-sm text-slate-600 bg-transparent outline-none cursor-pointer"
                            />
                          </label>
                        </div>
                      </div>

                      {/* 03 · HORA DE SALIDA (4 ZARPES WEB) */}
                      <div className="p-5 sm:p-7">
                        <div className="flex items-baseline justify-between mb-4">
                          <p className="text-[11px] font-semibold tracking-[0.15em] uppercase text-slate-400">
                            03 · Hora de salida
                          </p>
                          <span className="text-[11px] text-slate-400">{formatFechaBonita(pagoFecha || fechaSeleccionada)}</span>
                        </div>

                        <div className="grid grid-cols-2 gap-2.5">
                          {slotsWebBase.map((disp, idx) => {
                            const evDisp = evaluarEstadoSlot(disp, fechaSeleccionada);
                            const aptasEnSlot = evDisp.detalleMotos.filter(d => d.disponible && d.maxMinPosibles >= calcDuracion);
                            const disponible = !evDisp.esPasado && aptasEnSlot.length > 0;
                            const seleccionado = disponible && Boolean(slotParaPagoActual && slotParaPagoActual.id === disp.id);
                            const meta = METADATA_ZARPES_WEB[disp.minFijo] || { tag: `Salida ${idx + 1}` };

                            return (
                              <button
                                key={disp.id}
                                type="button"
                                disabled={!disponible}
                                onClick={() => disponible && setPagoSlotIdSeleccionado(disp.id)}
                                className={`p-4 rounded-xl text-left border transition-colors ${
                                  !disponible
                                    ? 'border-slate-100 bg-slate-50 cursor-not-allowed'
                                    : seleccionado
                                    ? 'border-[#0D1B2A] bg-[#0D1B2A] text-white cursor-pointer'
                                    : 'border-slate-200 bg-white hover:border-slate-300 cursor-pointer'
                                }`}
                              >
                                <span className={`block text-xs font-medium whitespace-nowrap ${
                                  !disponible ? 'text-slate-300' : seleccionado ? 'text-slate-300' : 'text-slate-500'
                                }`}>
                                  {meta.tag}
                                </span>
                                <span className={`block text-xl font-bold mt-0.5 whitespace-nowrap ${
                                  !disponible ? 'text-slate-300' : ''
                                }`}>
                                  {evDisp.horaInicioReal}
                                </span>
                                <span className={`flex items-center gap-1.5 text-[11px] mt-2 whitespace-nowrap ${
                                  !disponible ? 'text-slate-300' : seleccionado ? 'text-slate-300' : 'text-slate-500'
                                }`}>
                                  <span className={`w-1.5 h-1.5 rounded-full ${
                                    !disponible ? 'bg-slate-300' : 'bg-emerald-500'
                                  }`}></span>
                                  {!disponible
                                    ? (evDisp.esPasado ? 'Ya zarpó' : 'Agotado')
                                    : `${aptasEnSlot.length} ${aptasEnSlot.length === 1 ? 'moto disponible' : 'motos disponibles'}`}
                                </span>
                              </button>
                            );
                          })}
                        </div>

                        {horariosDisponiblesParaAgendar.length === 0 && (
                          <div className="mt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4 rounded-xl bg-slate-50 border border-slate-100">
                            <p className="text-xs text-slate-500">
                              No quedan salidas disponibles para esta fecha.
                            </p>
                            <button
                              type="button"
                              onClick={() => {
                                setFechaSeleccionada(diasOperativos.manana.fecha);
                                setPagoFecha(diasOperativos.manana.fecha);
                                setPagoSlotIdSeleccionado('');
                              }}
                              className="text-xs font-semibold text-[#0D1B2A] underline underline-offset-4 cursor-pointer whitespace-nowrap"
                            >
                              Ver mañana →
                            </button>
                          </div>
                        )}
                      </div>

                      {/* 04 · MOTOS */}
                      {slotParaPagoActual && horariosDisponiblesParaAgendar.length > 0 && (() => {
                        const evSel = evaluarEstadoSlot(slotParaPagoActual);
                        const motosAptas = evSel.detalleMotos.filter(d => d.disponible && d.maxMinPosibles >= calcDuracion).map(d => d.numero);
                        const seleccionActual = calcMotosSeleccionadas.filter(n => motosAptas.includes(n));
                        const listaFinalMotos = seleccionActual.length > 0 ? seleccionActual : motosAptas.slice(0, 1);
                        const cantSeleccionadas = listaFinalMotos.length;

                        const toggleMoto = (numMoto) => {
                          if (!motosAptas.includes(numMoto)) return;
                          setCalcMotosSeleccionadas(prev => {
                            const limpias = prev.filter(n => motosAptas.includes(n));
                            if (cantSeleccionadas === 1) {
                              return [numMoto];
                            }
                            if (limpias.includes(numMoto)) {
                              if (limpias.length === 1) return limpias;
                              return limpias.filter(n => n !== numMoto);
                            }
                            return [...limpias, numMoto].sort();
                          });
                        };

                        const seleccionarCantidadRapida = (n) => {
                          const tope = Math.min(n, motosAptas.length);
                          setCalcMotosSeleccionadas(motosAptas.slice(0, tope));
                          setCalcCantidadMotos(tope);
                        };

                        return (
                          <div className="p-5 sm:p-7">
                            <div className="flex items-center justify-between mb-4">
                              <p className="text-[11px] font-semibold tracking-[0.15em] uppercase text-slate-400">
                                04 · Motos
                              </p>
                              <div className="inline-flex p-0.5 bg-slate-100 rounded-lg">
                                {[1, 2, 3].map(n => {
                                  const habilitado = n <= motosAptas.length;
                                  const esActivo = cantSeleccionadas === n;
                                  return (
                                    <button
                                      key={n}
                                      type="button"
                                      disabled={!habilitado}
                                      onClick={() => seleccionarCantidadRapida(n)}
                                      className={`w-9 py-1 rounded-md text-xs font-semibold transition-colors ${
                                        !habilitado
                                          ? 'text-slate-300 cursor-not-allowed'
                                          : esActivo
                                          ? 'bg-white text-[#0D1B2A] shadow-sm cursor-pointer'
                                          : 'text-slate-500 hover:text-[#0D1B2A] cursor-pointer'
                                      }`}
                                    >
                                      {n}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                              {evSel.detalleMotos.map(dm => {
                                const esApta = dm.disponible && dm.maxMinPosibles >= calcDuracion;
                                const estaMarcada = esApta && listaFinalMotos.includes(dm.numero);
                                return (
                                  <button
                                    key={dm.numero}
                                    type="button"
                                    disabled={!esApta}
                                    onClick={() => toggleMoto(dm.numero)}
                                    className={`px-4 py-3 rounded-xl border text-left flex items-center justify-between gap-2 transition-colors ${
                                      !esApta
                                        ? 'border-slate-100 bg-slate-50 cursor-not-allowed'
                                        : estaMarcada
                                        ? 'border-[#0D1B2A] bg-[#0D1B2A] text-white cursor-pointer'
                                        : 'border-slate-200 bg-white hover:border-slate-300 cursor-pointer'
                                    }`}
                                  >
                                    <div className="min-w-0">
                                      <span className={`block text-sm font-semibold ${!esApta ? 'text-slate-300' : ''}`}>
                                        Moto {dm.numero}
                                      </span>
                                      <span className={`block text-[11px] truncate ${
                                        !esApta ? 'text-slate-300' : estaMarcada ? 'text-slate-400' : 'text-slate-400'
                                      }`}>
                                        {esApta ? dm.nombreModelo.replace('YAMAHA ', '') : 'No disponible'}
                                      </span>
                                    </div>
                                    <span className={`w-4 h-4 rounded-full border flex items-center justify-center shrink-0 ${
                                      estaMarcada ? 'border-white bg-white' : 'border-slate-300'
                                    }`}>
                                      {estaMarcada && <span className="w-2 h-2 rounded-full bg-[#0D1B2A]"></span>}
                                    </span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        );
                      })()}
                    </div>

                    {/* COLUMNA DERECHA: RESUMEN Y PAGO */}
                    <div className="lg:col-span-5">
                      <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-7 space-y-6 lg:sticky lg:top-24">
                        <h3 className="text-lg font-bold text-[#0D1B2A]">Tu reserva</h3>

                        {/* Resumen en filas limpias */}
                        <dl className="space-y-2.5 text-sm">
                          <div className="flex justify-between">
                            <dt className="text-slate-500">Fecha</dt>
                            <dd className="font-medium text-[#0D1B2A]">{formatFechaBonita(pagoFecha || fechaSeleccionada)}</dd>
                          </div>
                          <div className="flex justify-between">
                            <dt className="text-slate-500">Salida</dt>
                            <dd className="font-medium text-[#0D1B2A]">
                              {slotParaPagoActual && horariosDisponiblesParaAgendar.length > 0
                                ? evaluarEstadoSlot(slotParaPagoActual).horaInicioReal
                                : '—'}
                            </dd>
                          </div>
                          <div className="flex justify-between">
                            <dt className="text-slate-500">Tiempo en el agua</dt>
                            <dd className="font-medium text-[#0D1B2A]">
                              {calcDuracion + PROMO_MINUTOS_EXTRA_WEB} min
                              <span className="text-slate-400 font-normal"> ({calcDuracion} + 5)</span>
                            </dd>
                          </div>
                          <div className="flex justify-between">
                            <dt className="text-slate-500">Motos</dt>
                            <dd className="font-medium text-[#0D1B2A]">
                              {calcMotosSeleccionadas.length > 0 ? calcMotosSeleccionadas.map(n => `#${n}`).join(', ') : '—'}
                            </dd>
                          </div>
                          <div className="pt-3 mt-1 border-t border-slate-100 flex justify-between items-baseline">
                            <dt className="text-slate-500">Total</dt>
                            <dd className="text-right">
                              <span className="block text-2xl font-bold text-[#0D1B2A]">{montoCalculadoraEUR} €</span>
                              <span className="block text-xs text-slate-400">Bs. {montoCalculadoraBs.toFixed(2)} · Tasa BCV</span>
                            </dd>
                          </div>
                        </dl>

                        {/* Método de pago */}
                        <div className="grid grid-cols-2 p-0.5 bg-slate-100 rounded-lg">
                          {['Pago Móvil BCV', 'Efectivo € en Muelle'].map(met => (
                            <button
                              key={met}
                              type="button"
                              onClick={() => setPagoMetodo(met)}
                              className={`py-2 rounded-md text-xs font-semibold transition-colors cursor-pointer ${
                                pagoMetodo === met ? 'bg-white text-[#0D1B2A] shadow-sm' : 'text-slate-500 hover:text-[#0D1B2A]'
                              }`}
                            >
                              {met === 'Pago Móvil BCV' ? 'Pago Móvil' : 'Efectivo en muelle'}
                            </button>
                          ))}
                        </div>

                        {pagoMetodo === 'Pago Móvil BCV' && (
                          <dl className="space-y-1.5 text-xs bg-slate-50 rounded-xl p-4">
                            <div className="flex justify-between">
                              <dt className="text-slate-500">Banco</dt>
                              <dd className="text-[#0D1B2A] font-medium">Banesco 0134 / Venezuela 0102</dd>
                            </div>
                            <div className="flex justify-between">
                              <dt className="text-slate-500">Cédula</dt>
                              <dd className="text-[#0D1B2A] font-medium">V-18.492.310</dd>
                            </div>
                            <div className="flex justify-between">
                              <dt className="text-slate-500">Teléfono</dt>
                              <dd className="text-[#0D1B2A] font-medium">0412-8832100</dd>
                            </div>
                            <div className="flex justify-between">
                              <dt className="text-slate-500">Monto</dt>
                              <dd className="text-[#0D1B2A] font-semibold">Bs. {montoCalculadoraBs.toFixed(2)}</dd>
                            </div>
                          </dl>
                        )}

                        {pagoConfirmadoInfo && (
                          <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-100 text-xs text-emerald-900 space-y-0.5">
                            <p className="font-semibold flex items-center gap-1.5">
                              <Icons.CheckCircle className="w-4 h-4" /> Reserva registrada
                            </p>
                            <p className="text-emerald-800/80">
                              {pagoConfirmadoInfo.cliente} · {pagoConfirmadoInfo.horaSalida} a {pagoConfirmadoInfo.horaRetorno} · {pagoConfirmadoInfo.duracionMin} min
                            </p>
                          </div>
                        )}

                        {/* Formulario */}
                        <form onSubmit={handleReportarPagoYAgendar} className="space-y-3">
                          <div className="grid grid-cols-2 gap-2">
                            {[
                              { id: 'parguito', label: 'Playa Parguito' },
                              { id: 'sunsol', label: 'Sunsol Isla Caribe' }
                            ].map(p => (
                              <button
                                key={p.id}
                                type="button"
                                onClick={() => setPagoPunto(p.id)}
                                className={`py-2.5 rounded-lg text-xs font-semibold border transition-colors cursor-pointer ${
                                  pagoPunto === p.id
                                    ? 'border-[#0D1B2A] bg-[#0D1B2A] text-white'
                                    : 'border-slate-200 text-slate-600 hover:border-slate-300'
                                }`}
                              >
                                {p.label}
                              </button>
                            ))}
                          </div>

                          <input
                            type="text"
                            required
                            placeholder="Nombre y apellido"
                            value={pagoNombre}
                            onChange={e => setPagoNombre(e.target.value)}
                            className="w-full px-4 py-3 rounded-lg border border-slate-200 text-sm text-[#0D1B2A] placeholder:text-slate-400 focus:outline-none focus:border-[#0D1B2A] transition-colors"
                          />
                          <input
                            type="tel"
                            required
                            placeholder="WhatsApp (ej. 0412-1234567)"
                            value={pagoToldo}
                            onChange={e => setPagoToldo(e.target.value)}
                            className="w-full px-4 py-3 rounded-lg border border-slate-200 text-sm text-[#0D1B2A] placeholder:text-slate-400 focus:outline-none focus:border-[#0D1B2A] transition-colors"
                          />

                          {pagoMetodo === 'Pago Móvil BCV' && (
                            <div className="grid grid-cols-2 gap-2">
                              <input
                                type="text"
                                required
                                placeholder="Nº de referencia"
                                value={pagoReferencia}
                                onChange={e => setPagoReferencia(e.target.value)}
                                className="w-full px-4 py-3 rounded-lg border border-slate-200 text-sm text-[#0D1B2A] placeholder:text-slate-400 focus:outline-none focus:border-[#0D1B2A] transition-colors"
                              />
                              <label className="px-3 py-3 rounded-lg border border-dashed border-slate-300 text-xs text-slate-500 hover:border-slate-400 flex items-center justify-center cursor-pointer truncate transition-colors">
                                <span className="truncate">{pagoCaptureNombre || 'Adjuntar capture'}</span>
                                <input
                                  type="file"
                                  accept="image/*"
                                  onChange={e => handleSubirArchivoCapture(e, 'directo')}
                                  className="hidden"
                                />
                              </label>
                            </div>
                          )}

                          {pagoCaptureDataUrl && (
                            <div className="flex items-center justify-between gap-3 text-xs">
                              <div className="flex items-center gap-2">
                                <img src={pagoCaptureDataUrl} alt="Capture" className="h-9 w-9 rounded-md object-cover" />
                                <span className="text-slate-500">Capture adjunto</span>
                              </div>
                              <button
                                type="button"
                                onClick={() => {
                                  setPagoCaptureDataUrl(null);
                                  setPagoCaptureNombre('');
                                }}
                                className="text-slate-400 hover:text-slate-700 cursor-pointer"
                              >
                                Quitar
                              </button>
                            </div>
                          )}

                          <button
                            type="submit"
                            className="w-full mt-2 py-3.5 rounded-lg bg-[#E5097F] hover:bg-[#C8066C] text-white font-semibold text-sm cursor-pointer transition-colors"
                          >
                            Confirmar reserva · {montoCalculadoraEUR} €
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>
                </section>

                {/* ----------------------------------------------------------- */}
                {/* 6. CLÁUSULAS DE ATENCIÓN & FIRMA DIGITAL DEL CONTRATO       */}
                {/* (Fondo Fucsia #E5097F con tarjeta blanca ATENCIÓN + Firma)  */}
                {/* ----------------------------------------------------------- */}
                <section id="cli-waiver" className="relative overflow-hidden bg-[#E5097F] text-white pt-12 pb-0">

                  {/* Decoración de fondo: Manchas / Splash Fucsia Oscuro (#C8066C) como en tu captura */}
                  <svg
                    viewBox="0 0 1200 900"
                    className="absolute inset-0 w-full h-full object-cover pointer-events-none opacity-45"
                    preserveAspectRatio="none"
                  >
                    <path
                      d="M-80,80 C120,20 260,180 420,120 C580,60 740,-40 960,60 C1120,130 1250,40 1300,180 L1300,900 L-80,900 Z"
                      fill="#C8066C"
                    />
                    <circle cx="110" cy="240" r="95" fill="#B50460" opacity="0.55" />
                    <circle cx="1080" cy="340" r="130" fill="#B50460" opacity="0.45" />
                    <circle cx="950" cy="120" r="45" fill="#B50460" opacity="0.6" />
                    <circle cx="180" cy="540" r="70" fill="#B50460" opacity="0.5" />
                  </svg>

                  <div className="relative max-w-4xl mx-auto px-5 sm:px-10 z-10">

                    {/* TARJETA BLANCA REDONDEADA: "ATENCIÓN" + 5 CLÁUSULAS + FIRMA DIGITAL */}
                    <div className="bg-white text-[#0D1B2A] rounded-[32px] shadow-2xl p-6 sm:p-10 border-4 border-white/90">

                      {/* Encabezado ATENCIÓN con triángulos fucsia */}
                      <div className="flex items-center justify-center gap-3 mb-6">
                        <svg viewBox="0 0 36 36" className="w-8 h-8 text-[#E5097F] shrink-0" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M18 4 L33 30 L3 30 Z" />
                          <line x1="18" y1="13" x2="18" y2="21" />
                          <circle cx="18" cy="25.5" r="1.5" fill="currentColor" />
                        </svg>
                        <h3 className="font-condensed font-black uppercase text-3xl sm:text-4xl tracking-wider text-[#E5097F]">
                          ATENCIÓN
                        </h3>
                        <svg viewBox="0 0 36 36" className="w-8 h-8 text-[#E5097F] shrink-0" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M18 4 L33 30 L3 30 Z" />
                          <line x1="18" y1="13" x2="18" y2="21" />
                          <circle cx="18" cy="25.5" r="1.5" fill="currentColor" />
                        </svg>
                      </div>

                      {/* Las 5 Cláusulas Oficiales del Arte con sus iconos exactos y líneas divisoras */}
                      <div className="divide-y divide-slate-300 border-t border-b border-slate-300">

                        {/* Cláusula 1: Escudo con Check */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M20 4 L33 9 V19 C33 27.5 27 33.5 20 36 C13 33.5 7 27.5 7 19 V9 L20 4 Z" />
                              <polyline points="14,20 18,24 26,15" strokeWidth="2.8" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            La empresa no se hace responsable de daños y/o pérdidas de objetos pertenecientes al cliente (prendas, teléfonos, gorras, lentes, carteras, llaves, dinero, etc.)
                          </p>
                        </div>

                        {/* Cláusula 2: Persona en círculo */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <circle cx="20" cy="20" r="15" />
                              <circle cx="20" cy="15" r="4.5" />
                              <path d="M11 30 C11 24.5, 29 24.5, 29 30" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            La empresa no responde por daños físicos hacia su persona y/o terceros involucrados.
                          </p>
                        </div>

                        {/* Cláusula 3: Triángulo de Advertencia */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M20 6 L35 33 L5 33 Z" />
                              <line x1="20" y1="15" x2="20" y2="23" strokeWidth="2.8" />
                              <circle cx="20" cy="28" r="1.5" fill="currentColor" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            En caso de incumplimiento de la normativa, se harán máximo dos (2) llamados de atención; de no obedecer, se procederá de inmediato al retiro de la embarcación.
                          </p>
                        </div>

                        {/* Cláusula 4: Símbolo de Dinero / No Reembolso en círculo */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <circle cx="20" cy="20" r="15" />
                              <path d="M24 14.5 C24 12.5, 16 12.5, 16 16 C16 19.5, 24 19.5, 24 23.5 C24 27, 16 27, 16 24.5" />
                              <line x1="20" y1="10" x2="20" y2="30" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            Por incumplimiento de la normativa no tendrá derecho al reembolso.
                          </p>
                        </div>

                        {/* Cláusula 5: X en círculo (Responsabilidad por daños o averías) */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <circle cx="20" cy="20" r="15" />
                              <line x1="14" y1="14" x2="26" y2="26" strokeWidth="2.8" />
                              <line x1="26" y1="14" x2="14" y2="26" strokeWidth="2.8" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            En caso de deterioro o avería por imprudencia, no obedecer las normas, instrucciones del monitor o hacer un mal uso, el cliente será responsable del pago de la reparación y daños causados al vehículo y otros.
                          </p>
                        </div>

                        {/* Cláusula 6: Responsabilidad por Acompañantes y Terceros */}
                        <div className="py-3.5 flex items-center gap-4">
                          <div className="w-11 h-11 shrink-0 flex items-center justify-center text-[#0D1B2A]">
                            <svg viewBox="0 0 40 40" className="w-9 h-9" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M27 32 v-3 a5 5 0 0 0 -5 -5 H13 a5 5 0 0 0 -5 5 v3" />
                              <circle cx="17.5" cy="13" r="5" />
                              <path d="M33 30 v-1.5 a4.5 4.5 0 0 0 -3.5 -4.4" />
                              <path d="M26.5 8.5 a4.5 4.5 0 0 1 0 9" />
                            </svg>
                          </div>
                          <p className="text-xs sm:text-sm font-medium text-[#0D1B2A] leading-snug">
                            <strong>Responsabilidad por Acompañantes y Terceros:</strong> La persona que realiza la reserva y/o firma el contrato asume la responsabilidad solidaria, legal y financiera por todos los daños, pérdidas o averías causados a los vehículos por él/ella o por cualquiera de los acompañantes/conductores incluidos en su grupo o asignados a su reserva.
                          </p>
                        </div>
                      </div>

                      {/* FORMULARIO INTERACTIVO DE FIRMA DEL CONTRATO DIGITAL */}
                      <div className="mt-7 pt-6 border-t-2 border-dashed border-[#E5097F]/35">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                          <div>
                            <span className="inline-block px-3 py-0.5 rounded-full bg-[#E5097F]/10 text-[#E5097F] font-condensed text-xs font-extrabold uppercase tracking-wider">
                              PASO OBLIGATORIO ANTES DE ABORDAR
                            </span>
                            <h4 className="font-condensed text-xl sm:text-2xl font-black uppercase text-[#0D1B2A] mt-0.5">
                              FIRMA DIGITAL DEL CONTRATO DE ALQUILER
                            </h4>
                          </div>
                          <span className="text-xs text-slate-500">
                            Se envía directo al Panel de Muelle
                          </span>
                        </div>

                        {miWaiverFirmado && (
                          <div className="mb-5 p-4 rounded-2xl bg-[#1DA1DB] text-white flex items-center justify-between shadow-md">
                            <div>
                              <strong className="font-condensed text-base uppercase block">
                                ¡Contrato de Alquiler Firmado y Registrado en Muelle!
                              </strong>
                              <span className="text-xs opacity-90">
                                Titular: {miWaiverFirmado.nombre} ({miWaiverFirmado.documento}) • Hora: {miWaiverFirmado.hora}
                              {miWaiverFirmado.acompanantes && <span className="text-[11px] opacity-95 block mt-1 bg-black/15 px-2.5 py-1 rounded-lg">👥 Acompañantes declarados: {miWaiverFirmado.acompanantes}</span>}
                              </span>
                            </div>
                            <div className="flex items-center gap-2">
                              <button
                                type="button"
                                onClick={() => handleDescargarPDFContrato(miWaiverFirmado)}
                                className="px-3.5 py-2 rounded-xl bg-white text-[#0D1B2A] hover:bg-slate-100 font-condensed text-xs font-black uppercase tracking-wider shadow flex items-center gap-1.5 cursor-pointer transition"
                              >
                                <Icons.Download className="w-4 h-4 text-[#E5097F]" />
                                <span>Descargar Mi PDF</span>
                              </button>
                              <Icons.CheckCircle className="w-7 h-7 shrink-0 hidden sm:block" />
                            </div>
                          </div>
                        )}

                        <form onSubmit={handleGuardarWaiver} className="space-y-4">
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <input
                              type="text"
                              required
                              placeholder="Tu Nombre y Apellido *"
                              value={waiverNombre}
                              onChange={e => setWaiverNombre(e.target.value)}
                              className="px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-xs text-[#0D1B2A] focus:outline-none focus:border-[#E5097F]"
                            />
                            <input
                              type="text"
                              required
                              placeholder="Tu Cédula o Pasaporte *"
                              value={waiverDoc}
                              onChange={e => setWaiverDoc(e.target.value)}
                              className="px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-xs text-[#0D1B2A] focus:outline-none focus:border-[#E5097F]"
                            />
                            <input
                              type="tel"
                              required
                              placeholder="Tu Teléfono Celular (WhatsApp) *"
                              value={waiverTel}
                              onChange={e => setWaiverTel(e.target.value)}
                              className="px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-xs text-[#0D1B2A] font-mono focus:outline-none focus:border-[#E5097F]"
                            />
                          </div>

                          {/* CAMPO OPCIONAL: CONDUCTORES / ACOMPAÑANTES DEL GRUPO */}
                          <div className="pt-0.5">
                            {!mostrarAcompanantes ? (
                              <button
                                type="button"
                                onClick={() => setMostrarAcompanantes(true)}
                                className="inline-flex items-center gap-2 text-xs font-bold text-[#E5097F] hover:text-[#C8066C] transition-colors cursor-pointer py-1"
                              >
                                <span className="w-5 h-5 rounded-full bg-[#E5097F]/10 flex items-center justify-center text-xs font-black">+</span>
                                <span>+ Agregar acompañantes / otros conductores (opcional)</span>
                              </button>
                            ) : (
                              <div className="p-3.5 bg-slate-50 rounded-2xl border border-dashed border-[#E5097F]/40 space-y-2">
                                <div className="flex items-center justify-between">
                                  <label className="text-xs font-bold uppercase tracking-wider text-[#0D1B2A] flex items-center gap-2">
                                    <Icons.Users className="w-4 h-4 text-[#E5097F]" />
                                    Conductores / Acompañantes Adicionales del Grupo
                                  </label>
                                  <button
                                    type="button"
                                    onClick={() => { setMostrarAcompanantes(false); setWaiverAcompanantes(''); }}
                                    className="text-[11px] text-slate-400 hover:text-rose-500 font-semibold cursor-pointer"
                                  >
                                    Ocultar y quitar
                                  </button>
                                </div>
                                <input
                                  type="text"
                                  placeholder="Nombres y Cédulas de acompañantes (ej: María Pérez V-20..., Carlos Gómez...)"
                                  value={waiverAcompanantes}
                                  onChange={e => setWaiverAcompanantes(e.target.value)}
                                  className="w-full px-4 py-2.5 rounded-xl bg-white border border-slate-300 text-xs text-[#0D1B2A] focus:outline-none focus:border-[#E5097F]"
                                />
                                <p className="text-[11px] text-slate-500 italic leading-snug">
                                  Nota: El titular que firma asume la responsabilidad solidaria, legal y financiera por los acompañantes registrados (según la Cláusula 6).
                                </p>
                              </div>
                            )}
                          </div>

                          <div>
                            <div className="flex justify-between items-center mb-1.5">
                              <span className="font-condensed text-xs uppercase font-bold text-[#0D1B2A]">
                                DIBUJA TU FIRMA CON EL DEDO AQUÍ ABAJO:
                              </span>
                              <button
                                type="button"
                                onClick={limpiarCanvasFirma}
                                className="text-xs font-bold text-[#E5097F] underline cursor-pointer"
                              >
                                Borrar y repetir firma
                              </button>
                            </div>
                            <div className="relative h-44 w-full rounded-2xl bg-slate-50 border-2 border-dashed border-[#E5097F]/50 overflow-hidden">
                              <canvas
                                ref={canvasRef}
                                onMouseDown={iniciarTrazo}
                                onMouseMove={dibujarTrazo}
                                onMouseUp={terminarTrazo}
                                onMouseLeave={terminarTrazo}
                                onTouchStart={iniciarTrazo}
                                onTouchMove={dibujarTrazo}
                                onTouchEnd={terminarTrazo}
                                className="w-full h-full touch-canvas cursor-crosshair relative z-10"
                              />
                              {!haFirmadoCanvas && (
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-xs text-slate-400">
                                  Traza tu firma aquí para aceptar las cláusulas de atención
                                </div>
                              )}
                            </div>
                          </div>

                          {/* DECLARACIÓN CLARA ANTES DEL BOTÓN DE ENVÍO */}
                          <div className="p-3.5 rounded-2xl bg-[#E5097F]/5 border-2 border-[#E5097F]/30 flex items-start gap-3 shadow-sm">
                            <Icons.AlertCircle className="w-5 h-5 text-[#E5097F] shrink-0 mt-0.5" />
                            <p className="text-xs sm:text-sm font-semibold text-[#0D1B2A] leading-snug">
                              "Al firmar, declaro que acepto las normas y me hago responsable por mí y por los acompañantes de mi grupo/reserva."
                            </p>
                          </div>

                          <button
                            type="submit"
                            className="w-full py-4 rounded-full bg-[#E5097F] hover:bg-[#C8066C] text-white font-condensed text-base font-black uppercase tracking-widest cursor-pointer shadow-lg transition"
                          >
                            ACEPTAR NORMAS, ASUMIR RESPONSABILIDAD Y FIRMAR CONTRATO
                          </button>
                        </form>
                      </div>
                    </div>
                  </div>

                  {/* PIE DE SECCIÓN CON OLAS AZULES (#8FD6F2 + #1DA1DB) Y SELLOS ALIADOS */}
                  <div className="relative mt-8 pt-6">
                    <svg
                      viewBox="0 0 1440 130"
                      className="w-full h-14 sm:h-20 block -mb-1"
                      preserveAspectRatio="none"
                    >
                      <path
                        d="M0,45 C240,115 480,-15 720,45 C960,105 1200,5 1440,55 L1440,130 L0,130 Z"
                        fill="#8FD6F2"
                      />
                      <path
                        d="M0,70 C300,10 600,125 920,60 C1160,15 1320,85 1440,65 L1440,130 L0,130 Z"
                        fill="#1DA1DB"
                      />
                    </svg>

                    <div className="bg-[#1DA1DB] text-white px-6 sm:px-12 pb-8 pt-2">
                      <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-6 text-center sm:text-left">
                        <div className="flex flex-wrap items-center justify-center sm:justify-start gap-6">
                          <Icons.LogoDivinaAcuatica className="h-11 w-auto" theme="dark" />
                          <div className="h-8 w-px bg-white/35 hidden sm:block" />
                          <div className="leading-tight">
                            <span className="font-serif italic text-base sm:text-lg font-bold block tracking-wide">
                              La Divina Comedia
                            </span>
                            <span className="text-[10px] uppercase tracking-widest text-white/90 block">
                              El Club de Playa Parguito
                            </span>
                          </div>
                          <div className="h-8 w-px bg-white/35 hidden sm:block" />
                          <div className="flex items-center gap-2">
                            <span className="px-2.5 py-1 rounded bg-white/15 font-condensed font-black text-xs tracking-widest uppercase">
                              INEA
                            </span>
                            <span className="px-2.5 py-1 rounded bg-white/15 font-condensed font-extrabold text-xs tracking-wider uppercase">
                              UUF! ESTUDIO
                            </span>
                          </div>
                        </div>

                        <div className="flex items-center gap-2.5 mx-auto sm:mx-0 bg-white/15 px-4 py-2 rounded-2xl">
                          <svg viewBox="0 0 24 24" className="w-6 h-6 text-white shrink-0" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="5" />
                            <circle cx="12" cy="12" r="4.5" />
                            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
                          </svg>
                          <div className="text-left text-xs font-bold leading-tight">
                            <span className="block">@divinacomedia.acuatica</span>
                            <span className="block text-white/90">@ladivina.comedia</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              </>
            ) : (
              /* ============================================================= */
              /* VISTA 2: PANEL DE CONTROL EXCLUSIVO DEL OPERADOR DE MUELLE    */
              /* (Sin relleno publicitario: puro control técnico y de caja)    */
              /* ============================================================= */
              <div className="bg-[#F8FAFC] min-h-[750px] pb-16">

                {/* CABECERA OPERATIVA MODERNA DEL MUELLE */}
                <div className="bg-[#0D1B2A] text-white px-5 sm:px-10 py-7 border-b border-slate-800 shadow-xl">
                  <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
                    <div className="flex items-center gap-4">
                      <div className="p-2 bg-white/5 rounded-2xl border border-white/10 shrink-0">
                        <Icons.LogoDivinaAcuatica className="h-10 sm:h-12 w-auto" />
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span className="text-[11px] font-mono uppercase tracking-widest text-[#7DD3FC] font-bold">
                            Muelle Activo • En Línea
                          </span>
                        </div>
                        <h1 className="text-2xl sm:text-3xl font-extrabold uppercase tracking-tight text-white mt-0.5">
                          Panel Operativo de Muelle
                        </h1>
                        <p className="text-xs text-slate-400">
                          Playa Parguito & Sunsol Isla Caribe • Control de Flota, Despacho y Caja
                        </p>
                      </div>
                    </div>

                    {/* SELECTOR DE RETRASO GLOBAL DEL MUELLE */}
                    <div className="flex items-center gap-2 bg-[#07111C]/80 backdrop-blur-sm p-2 rounded-2xl border border-white/10 self-start lg:self-auto">
                      <span className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-2">
                        Retraso:
                      </span>
                      {[0, 10, 15, 20].map((min) => (
                        <button
                          key={min}
                          type="button"
                          onClick={() => setRetrasoGlobal(min)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                            retrasoGlobal === min
                              ? min === 0
                                ? 'bg-[#0284C7] text-white shadow-sm'
                                : 'bg-[#E5097F] text-white shadow-sm'
                              : 'text-slate-400 hover:text-white hover:bg-white/5'
                          }`}
                        >
                          {min === 0 ? 'En Hora' : `+${min}m`}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* NAVEGACIÓN DE MÓDULOS DEL OPERADOR */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-6">
                    <button
                      type="button"
                      onClick={() => setTabOperador('operaciones')}
                      className={`p-3.5 rounded-2xl text-left transition-all cursor-pointer border flex flex-col justify-between ${
                        tabOperador === 'operaciones'
                          ? 'bg-gradient-to-r from-[#E5097F] to-[#D00772] text-white border-transparent shadow-lg shadow-[#E5097F]/20'
                          : 'bg-white/5 hover:bg-white/10 text-slate-300 border-white/10'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider">1. Flota & Despacho</span>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                          tabOperador === 'operaciones' ? 'bg-black/25 text-white' : 'bg-white/10 text-slate-300'
                        }`}>
                          {motosEnAgua.length} agua
                        </span>
                      </div>
                      <span className="text-[10px] text-white/70 mt-1 block">Telemetría, Gasolina y Retorno</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setTabOperador('agenda_admin')}
                      className={`p-3.5 rounded-2xl text-left transition-all cursor-pointer border flex flex-col justify-between ${
                        tabOperador === 'agenda_admin'
                          ? 'bg-gradient-to-r from-[#E5097F] to-[#D00772] text-white border-transparent shadow-lg shadow-[#E5097F]/20'
                          : 'bg-white/5 hover:bg-white/10 text-slate-300 border-white/10'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider">2. Agenda de Citas</span>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                          tabOperador === 'agenda_admin' ? 'bg-black/25 text-white' : 'bg-white/10 text-slate-300'
                        }`}>
                          {reservasPendientes.length} cola
                        </span>
                      </div>
                      <span className="text-[10px] text-white/70 mt-1 block">Control de horarios de salida</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setTabOperador('caja_admin')}
                      className={`p-3.5 rounded-2xl text-left transition-all cursor-pointer border flex flex-col justify-between ${
                        tabOperador === 'caja_admin'
                          ? 'bg-gradient-to-r from-[#E5097F] to-[#D00772] text-white border-transparent shadow-lg shadow-[#E5097F]/20'
                          : 'bg-white/5 hover:bg-white/10 text-slate-300 border-white/10'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider">3. Arqueo de Caja</span>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                          tabOperador === 'caja_admin' ? 'bg-black/25 text-white' : 'bg-white/10 text-slate-300'
                        }`}>
                          {totalEurosDia}€
                        </span>
                      </div>
                      <span className="text-[10px] text-white/70 mt-1 block">Tasa BCV, Vueltos y Captures</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setTabOperador('waivers_admin')}
                      className={`p-3.5 rounded-2xl text-left transition-all cursor-pointer border flex flex-col justify-between ${
                        tabOperador === 'waivers_admin'
                          ? 'bg-gradient-to-r from-[#E5097F] to-[#D00772] text-white border-transparent shadow-lg shadow-[#E5097F]/20'
                          : 'bg-white/5 hover:bg-white/10 text-slate-300 border-white/10'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold uppercase tracking-wider">4. Firmas Waivers</span>
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono font-bold ${
                          tabOperador === 'waivers_admin' ? 'bg-black/25 text-white' : 'bg-white/10 text-slate-300'
                        }`}>
                          {firmasDia.length}
                        </span>
                      </div>
                      <span className="text-[10px] text-white/70 mt-1 block">Contratos digitales firmados</span>
                    </button>
                  </div>
                </div>

                {/* CONTENIDO INTERNO DEL OPERADOR */}
                <div className="p-4 sm:p-8 lg:p-10 space-y-8 max-w-7xl mx-auto">

                  {/* SUB-MÓDULO 1: CONTROL TÉCNICO DE MOTOS (DESPACHO, RETORNO, HORÓMETRO, GASOLINA, ZONAS Y MANTENIMIENTO) */}
                  {tabOperador === 'operaciones' && (
                    <div className="space-y-8">

                      {/* RADAR DE ZONAS EN VIVO: PLAYA PARGUITO vs SUNSOL ISLA CARIBE + ALERTAS DE MANTENIMIENTO */}
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">

                        {/* ZONA 1: PLAYA PARGUITO (TOLDOS Y MUELLE PRINCIPAL) */}
                        <div className="lg:col-span-4 bg-white rounded-3xl border border-slate-200/80 shadow-xl shadow-slate-200/40 p-5 sm:p-6 space-y-4">
                          <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                            <div>
                              <span className="text-[10px] font-mono uppercase tracking-wider text-[#0284C7] font-bold block">Punto Operativo #1</span>
                              <h3 className="text-lg font-extrabold text-[#0D1B2A]">Playa Parguito</h3>
                            </div>
                            <span className="px-3 py-1 rounded-full bg-[#E0F2FE] text-[#0284C7] text-xs font-bold">
                              {resumenPuntos.parguito.motos.length} {resumenPuntos.parguito.motos.length === 1 ? 'Moto' : 'Motos'}
                            </span>
                          </div>

                          <div className="space-y-2 text-xs">
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">Unidades en orilla:</span>
                              <strong className="text-slate-900">
                                {resumenPuntos.parguito.motos.length > 0
                                  ? resumenPuntos.parguito.motos.map(m => `#${m.numero} (${m.estado === 'en_agua' ? 'Agua' : m.estado === 'disponible' ? 'Libre' : 'Taller'})`).join(' • ')
                                  : 'Ninguna'}
                              </strong>
                            </div>
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">Navegando ahora:</span>
                              <strong className="text-[#0284C7]">
                                {resumenPuntos.parguito.enAgua.length > 0
                                  ? resumenPuntos.parguito.enAgua.map(m => `${m.alquiler.cliente} (#${m.numero})`).join(', ')
                                  : '0 en agua'}
                              </strong>
                            </div>
                            <div className="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                              <span className="text-slate-500 font-medium">En espera:</span>
                              <strong className="text-slate-700">
                                {resumenPuntos.parguito.clientesCola.length > 0
